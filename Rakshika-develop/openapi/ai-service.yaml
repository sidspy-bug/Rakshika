openapi: 3.1.0
info:
  title: Rakshika AI Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /ai/chat:
    post:
      tags: [AI]
      summary: Safety chat
      security:
        - bearerAuth: []
      responses:
        '200': { description: Reply }
  /ai/risk:
    post:
      tags: [AI]
      summary: Risk analysis
      security:
        - bearerAuth: []
      responses:
        '200': { description: Risk score }
  /ai/summary:
    post:
      tags: [AI]
      summary: Incident summary
      security:
        - bearerAuth: []
      responses:
        '200': { description: Summary }
  /ai/voice-analysis:
    post:
      tags: [AI]
      summary: Voice analysis
      security:
        - bearerAuth: []
      responses:
        '200': { description: Analysis }
