version: '3.8'

services:
  # ── INFRASTRUCTURE ───────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rakshika-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rakshika_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rakshika_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rakshika-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API GATEWAY ─────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    container_name: rakshika-gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MICROSERVICES ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/auth.Dockerfile
    container_name: rakshika-auth
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your-super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/user.Dockerfile
    container_name: rakshika-user
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  emergency-service:
    build:
      context: .
      dockerfile: infrastructure/docker/emergency.Dockerfile
    container_name: rakshika-emergency
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  community-service:
    build:
      context: .
      dockerfile: infrastructure/docker/community.Dockerfile
    container_name: rakshika-community
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  location-service:
    build:
      context: .
      dockerfile: infrastructure/docker/location.Dockerfile
    container_name: rakshika-location
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/notification.Dockerfile
    container_name: rakshika-notification
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
      - FIREBASE_CREDENTIALS_PATH=services/notification-service/app/firebase-credentials.json
    depends_on:
      postgres:
        condition: service_healthy

  evidence-service:
    build:
      context: .
      dockerfile: infrastructure/docker/evidence.Dockerfile
    container_name: rakshika-evidence
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/rakshika_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    container_name: rakshika-ai
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_GEMINI_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # ── NGINX ROUTER ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rakshika-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - emergency-service
      - community-service
      - location-service
      - notification-service
      - evidence-service
      - ai-service

volumes:
  postgres_data:
