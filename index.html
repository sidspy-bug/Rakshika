    <script>
      // Defensive bridge shim: prevents uncaught TypeError if native plugins dispatch events during cold boot
      (function() {
        var dummy = { triggerEvent: function() {} };
        if (typeof window !== "undefined") {
          window.Capacitor = window.Capacitor || {};
          if (!window.Capacitor.triggerEvent) window.Capacitor.triggerEvent = function() {};
        }
        if (typeof globalThis !== "undefined") {
          globalThis.Capacitor = globalThis.Capacitor || {};
          if (!globalThis.Capacitor.triggerEvent) globalThis.Capacitor.triggerEvent = function() {};
        }
      })();
    </script>
