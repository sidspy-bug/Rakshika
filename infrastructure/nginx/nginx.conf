events {
    worker_connections 1024;
}

http {
    upstream gateway {
        server api-gateway:8000;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    upstream user_service {
        server user-service:8000;
    }

    upstream emergency_service {
        server emergency-service:8000;
    }

    upstream community_service {
        server community-service:8000;
    }

    upstream location_service {
        server location-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    upstream evidence_service {
        server evidence-service:8000;
    }

    upstream ai_service {
        server ai-service:8000;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Global rate limit
        limit_req zone=api_limit burst=50 nodelay;

        # Health check (no auth needed)
        location /health {
            return 200 '{"status":"ok","service":"nginx-proxy"}';
            add_header Content-Type application/json;
        }

        # ── API Gateway (main entry) ────────────────────────────────
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;

            # CORS
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ── Direct service routes (for internal/debug) ──────────────
        location /internal/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/users/ {
            proxy_pass http://user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/emergencies/ {
            proxy_pass http://emergency_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/community/ {
            proxy_pass http://community_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/location/ {
            proxy_pass http://location_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/notifications/ {
            proxy_pass http://notification_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/evidence/ {
            proxy_pass http://evidence_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # File upload size limit (for evidence uploads)
        client_max_body_size 100M;

        # Gzip compression
        gzip on;
        gzip_types application/json text/plain text/css application/javascript;
        gzip_min_length 256;
    }
}
