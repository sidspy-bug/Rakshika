openapi: 3.1.0
info:
  title: Rakshika Auth Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, phone]
              properties:
                fullName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                phone: { type: string, minLength: 7 }
      responses:
        '201':
          description: Account created
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      security: []
      responses:
        '200':
          description: Token rotated
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send OTP
      security: []
      responses:
        '200':
          description: OTP sent
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP
      security: []
      responses:
        '200':
          description: OTP verified
  /auth/profile:
    get:
      tags: [Auth]
      summary: Current session profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
