openapi: 3.1.0
info:
  title: Rakshika Emergency Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /emergencies/sos:
    post:
      tags: [Emergencies]
      summary: Create SOS
      security:
        - bearerAuth: []
      responses:
        '201': { description: Emergency created }
  /emergencies/{emergencyId}:
    get:
      tags: [Emergencies]
      summary: Get emergency
      security:
        - bearerAuth: []
      parameters:
        - name: emergencyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Emergency }
  /emergencies/{emergencyId}/cancel:
    post:
      tags: [Emergencies]
      summary: Cancel emergency
      security:
        - bearerAuth: []
      parameters:
        - name: emergencyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancelled }
  /emergencies/history:
    get:
      tags: [Emergencies]
      summary: Emergency history
      security:
        - bearerAuth: []
      responses:
        '200': { description: History }
  /emergencies/{emergencyId}/status:
    patch:
      tags: [Emergencies]
      summary: Update status
      security:
        - bearerAuth: []
      parameters:
        - name: emergencyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
