openapi: 3.1.0
info:
  title: Rakshika Evidence Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /evidence/upload:
    post:
      tags: [Evidence]
      summary: Upload evidence
      security:
        - bearerAuth: []
      responses:
        '201': { description: Uploaded }
  /evidence/video:
    post:
      tags: [Evidence]
      summary: Register video evidence
      security:
        - bearerAuth: []
      responses:
        '201': { description: Uploaded }
  /evidence/audio:
    post:
      tags: [Evidence]
      summary: Register audio evidence
      security:
        - bearerAuth: []
      responses:
        '201': { description: Uploaded }
  /evidence/{evidenceId}:
    get:
      tags: [Evidence]
      summary: Get evidence
      security:
        - bearerAuth: []
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Evidence }
    delete:
      tags: [Evidence]
      summary: Delete evidence
      security:
        - bearerAuth: []
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
