openapi: 3.1.0
info:
  title: Rakshika Location Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /location/update:
    post:
      tags: [Location]
      summary: Update live location
      security:
        - bearerAuth: []
      responses:
        '200': { description: Location stored }
  /location/live/{emergencyId}:
    get:
      tags: [Location]
      summary: Live location
      security:
        - bearerAuth: []
      parameters:
        - name: emergencyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Live location }
  /location/history/{emergencyId}:
    get:
      tags: [Location]
      summary: Location history
      security:
        - bearerAuth: []
      parameters:
        - name: emergencyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: History }
  /location/safe-route:
    get:
      tags: [Location]
      summary: Safe route
      security:
        - bearerAuth: []
      responses:
        '200': { description: Route }
