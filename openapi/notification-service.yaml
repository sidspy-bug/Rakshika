openapi: 3.1.0
info:
  title: Rakshika Notification Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /notifications/push:
    post:
      tags: [Notifications]
      summary: Send push notification
      security:
        - bearerAuth: []
      responses:
        '200': { description: Sent }
  /notifications/sms:
    post:
      tags: [Notifications]
      summary: Send SMS notification
      security:
        - bearerAuth: []
      responses:
        '200': { description: Sent }
  /notifications/email:
    post:
      tags: [Notifications]
      summary: Send email notification
      security:
        - bearerAuth: []
      responses:
        '200': { description: Sent }
  /notifications/community:
    post:
      tags: [Notifications]
      summary: Broadcast to community
      security:
        - bearerAuth: []
      responses:
        '200': { description: Queued }
  /notifications/history:
    get:
      tags: [Notifications]
      summary: Notification history
      security:
        - bearerAuth: []
      responses:
        '200': { description: History }
