openapi: 3.1.0
info:
  title: Rakshika User Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /users/me:
    get:
      tags: [Users]
      summary: Get profile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Profile }
    put:
      tags: [Users]
      summary: Update profile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Updated }
  /users/me/preferences:
    get:
      tags: [Users]
      summary: Get preferences
      security:
        - bearerAuth: []
      responses:
        '200': { description: Preferences }
    put:
      tags: [Users]
      summary: Update preferences
      security:
        - bearerAuth: []
      responses:
        '200': { description: Updated }
  /users/me/contacts:
    get:
      tags: [Users]
      summary: List contacts
      security:
        - bearerAuth: []
      responses:
        '200': { description: Contacts }
    post:
      tags: [Users]
      summary: Add contact
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
  /users/me/contacts/{contactId}:
    put:
      tags: [Users]
      summary: Update contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Users]
      summary: Delete contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
